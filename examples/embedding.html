<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embedding · FTGS Player</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="../site/theme.css">
<link rel="stylesheet" href="./embedding.css">
<main>
  <h1>Embed a 4D scene</h1>
  <p id="description">The host owns this page and its controls. The player handles rendering and playback.</p>
  <nav aria-label="Examples"><div class="modes"><a id="canvas-example" class="button" href="?mode=canvas">Canvas</a><a id="iframe-example" class="button" href="?mode=iframe">Iframe</a></div><a id="jensen-example" class="button" href="?example=jensen-2m">Try Jensen · 2M</a><a class="player-link" href="../">Open player ↗</a></nav>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5Z" /></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M7 5.5h3.5v13H7zm6.5 0H17v13h-3.5z" /></symbol>
    <symbol id="sound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" /></symbol>
    <symbol id="silent" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4Zm5 4 5 6m0-6-5 6" /></symbol>
  </defs></svg>
  <div id="viewer" data-state="empty"><canvas id="canvas" tabindex="0" aria-label="Animated scene"></canvas></div>
  <div class="transport" role="group" aria-label="Host playback controls">
    <button id="play-toggle" class="icon-button" aria-label="Play" title="Play" disabled><svg class="solid-icon" aria-hidden="true"><use id="play-icon" href="#play" /></svg></button>
    <button id="mute-toggle" class="icon-button" aria-label="Mute" title="Mute" aria-pressed="false" hidden><svg aria-hidden="true"><use id="audio-icon" href="#sound" /></svg></button>
    <input id="timeline" type="range" min="0" max="1" step="0.0001" value="0" aria-label="Seek" disabled>
    <output id="timecode">0:00</output>
  </div>
  <p id="message" role="status"></p>
  <p class="note">Your UI, the player's rendering and playback. <a href="https://github.com/OpsiClear-4DGS/ftgs-player/blob/main/docs/API.md">API documentation ↗</a></p>
</main>
<script type="module" src="./embedding.js"></script>
</html>
